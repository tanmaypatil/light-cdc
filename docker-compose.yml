version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightcdc_dev
      POSTGRES_USER: lightcdc
      POSTGRES_PASSWORD: lightcdc_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./test-harness/init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightcdc -d lightcdc_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: ./test-harness
    command: python seed.py
    environment:
      DATABASE_URL: postgresql://lightcdc:lightcdc_dev_pw@postgres:5432/lightcdc_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  updater:
    build: ./test-harness
    command: python updater.py
    environment:
      DATABASE_URL: postgresql://lightcdc:lightcdc_dev_pw@postgres:5432/lightcdc_dev
      UPDATE_INTERVAL_SECONDS: "120"
    depends_on:
      seed:
        condition: service_completed_successfully

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEV_DATABASE_URL: postgresql://lightcdc:lightcdc_dev_pw@postgres:5432/lightcdc_dev
      SQLITE_DATA_DIR: /data
      WATCH_CONFIG_PATH: /app/watch.json
      LOG_LEVEL: DEBUG
    volumes:
      - sqlite_data:/data
      - ./watch.json:/app/watch.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  ui:
    build: ./ui
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
  sqlite_data:
